<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KEIRIN LIVE DATA VIEWER (Step 1)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-3">
  <div class="max-w-xl mx-auto space-y-3">
    <!-- コンパクトヘッダー -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
      <div>
        <div class="text-xs text-cyan-400 font-bold">KEIRIN AUTO-SYNC ENGINE</div>
        <h1 id="date-title" class="text-base font-bold">データ読込中...</h1>
      </div>
      <div class="text-right">
        <span id="status-badge" class="text-[11px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-700">待機中</span>
        <div id="updated-at" class="text-[10px] text-slate-400 mt-1">--:--</div>
      </div>
    </div>

    <!-- 開催場ボタン一覧 -->
    <div id="venue-tabs" class="flex flex-wrap gap-1.5"></div>

    <!-- フィルター -->
    <div class="flex gap-1.5 text-xs">
      <button onclick="setFilter('ALL')" id="f-ALL" class="px-3 py-1.5 rounded-lg bg-cyan-600 font-bold">すべて</button>
      <button onclick="setFilter('FINISHED')" id="f-FINISHED" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300">確定済 (結果)</button>
      <button onclick="setFilter('OPEN')" id="f-OPEN" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300">これから発走</button>
    </div>

    <!-- レース一覧 -->
    <div id="race-list" class="space-y-2"></div>
  </div>

  <script>
    let appData = null;
    let selectedVenueIdx = 0;
    let currentFilter = 'ALL';

    async function loadData() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        if (!res.ok) throw new Error('data.json がまだ生成されていません');
        appData = await res.json();

        document.getElementById('date-title').textContent = appData.display_date || '開催一覧';
        document.getElementById('updated-at').textContent = '更新: ' + (appData.updated_at || '');
        const badge = document.getElementById('status-badge');
        if (appData.venues && appData.venues.length > 0) {
          badge.textContent = `実データ取得済 (${appData.venues.length}場)`;
        } else {
          badge.textContent = '開催データ空 (' + appData.status + ')';
          badge.className = 'text-[11px] px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-700';
        }
        renderVenues();
        renderRaces();
      } catch (e) {
        document.getElementById('date-title').textContent = '初回データ未生成';
        document.getElementById('race-list').innerHTML = `
          <div class="bg-slate-900 border border-amber-700/60 rounded-xl p-4 text-xs text-amber-300 leading-relaxed">
            ⚠️ まだ <b>data.json</b> が作られていません。<br>
            GitHubの「Actions」タブ →「Fetch Keirin Data」→「Run workflow」を1回押すと、数秒後に全レースが自動表示されます！
          </div>`;
      }
    }

    function renderVenues() {
      const box = document.getElementById('venue-tabs');
      box.innerHTML = '';
      (appData.venues || []).forEach((v, idx) => {
        const active = idx === selectedVenueIdx;
        const btn = document.createElement('button');
        btn.className = active
          ? 'px-3 py-1.5 rounded-lg bg-cyan-500 text-slate-950 font-extrabold text-xs shadow'
          : 'px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-200 font-bold text-xs';
        btn.textContent = v.name;
        btn.onclick = () => { selectedVenueIdx = idx; renderVenues(); renderRaces(); };
        box.appendChild(btn);
      });
    }

    function setFilter(f) {
      currentFilter = f;
      ['ALL', 'FINISHED', 'OPEN'].forEach(k => {
        document.getElementById('f-' + k).className = k === f
          ? 'px-3 py-1.5 rounded-lg bg-cyan-600 font-bold'
          : 'px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300';
      });
      renderRaces();
    }

    function renderRaces() {
      const list = document.getElementById('race-list');
      list.innerHTML = '';
      const venue = (appData.venues || [])[selectedVenueIdx];
      if (!venue) return;

      const filtered = (venue.races || []).filter(r => {
        if (currentFilter === 'FINISHED') return r.status === '確定済';
        if (currentFilter === 'OPEN') return r.status !== '確定済';
        return true;
      });

      filtered.forEach(r => {
        const isDone = r.status === '確定済';
        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between';
        card.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="w-9 h-9 rounded-lg bg-slate-800 flex items-center justify-center font-black text-sm text-cyan-400">${r.r}R</span>
            <div>
              <div class="text-xs font-bold">${venue.name} ${r.r}R <span class="text-slate-400 font-normal ml-1">${r.start_time || ''}</span></div>
              <div class="mt-0.5">
                ${isDone
                  ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">確定済</span>`
                  : `<span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800">発売中</span>`}
              </div>
            </div>
          </div>
          <div class="text-right">
            ${isDone
              ? `<div class="text-sm font-black text-amber-400">${r.result_3tan}</div><div class="text-xs text-slate-300 font-bold">${r.payout}</div>`
              : `<div class="text-xs text-slate-400">出走待機</div>`}
          </div>
        `;
        list.appendChild(card);
      });
    }

    loadData();
  </script>
</body>
</html>
