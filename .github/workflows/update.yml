name: Auto Fetch Keirin Data

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 2 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Fetch Keirin Data
        run: python scripts/fetch_keirin.py
      - name: Commit Data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "actions-user"
          git add data/today.json data/tomorrow.json
          git diff --staged --quiet || git commit -m "Update keirin race data"
          git push
