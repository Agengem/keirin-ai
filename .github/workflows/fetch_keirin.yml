name: Fetch Keirin Data

on:
  schedule:
    # 毎日 8:00, 12:00, 16:00, 18:00, 20:00, 22:00, 23:45 (JST) に自動実行
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
    - cron: '0 9 * * *'
    - cron: '0 11 * * *'
    - cron: '0 13 * * *'
    - cron: '45 14 * * *'
  workflow_dispatch: # 手動で「今すぐ実行」ボタンも使えるようにする

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run Keirin fetcher
        run: python fetch.py

      - name: Commit and push data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update keirin data" && git push)
